<text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="581.0">• "Evaluar cotización [+]" se abre en el diagrama de la Lección 1: formato, filtro eliminatorio, landed cost y puntaje.</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="607.0">• "Lista para importar" es donde empieza el proceso Importación. Nico aprueba todo lo que compromete dinero o se envía a terceros.</tspan></text>
