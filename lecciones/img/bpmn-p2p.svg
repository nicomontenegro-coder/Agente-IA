<text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="705.0">• La RFQ va a varios proveedores de la familia de productos. Si uno no responde en el plazo, su invitación queda "Sin respuesta": lo vigila el agente.</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="731.0">• Filtros eliminatorios al evaluar: sin certificados pertinentes, o no acepta carta de crédito en los primeros embarques. Más tipos de certificado (calidad, cumplimiento, gestión) suman puntaje.</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="757.0">• Primer embarque: carta de crédito; el banco paga contra los documentos de embarque, ya en el proceso Importación. Embarques siguientes: anticipo y saldo por T/T.</tspan></text>
