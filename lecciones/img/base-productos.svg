<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900">
<defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="1560" height="900" fill="#ffffff"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="780.0" y="30.0">Base de conocimiento de productos: cómo se organiza habitualmente</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="780.0" y="56.0">Jerarquía (dónde va el producto) + atributos (cómo se describe) + reglas y documentos (qué se sabe de él)</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="250" y="120.0">1. La jerarquía (taxonomía)</tspan></text>
<rect x="80" y="150" width="340" height="70" rx="10" fill="#f3f7fb" stroke="#1f2937" stroke-width="1.6"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="250.0" y="176.9">Segmento</tspan><tspan x="250.0" y="193.1">Materiales de construcción</tspan></text>
<path d="M250,220 L250,255" fill="none" stroke="#1f2937" stroke-width="1.7" marker-end="url(#punta)"/>
<rect x="80" y="255" width="340" height="70" rx="10" fill="#f3f7fb" stroke="#1f2937" stroke-width="1.6"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="250.0" y="281.9">Familia</tspan><tspan x="250.0" y="298.1">Sistemas de cañerías</tspan></text>
<path d="M250,325 L250,360" fill="none" stroke="#1f2937" stroke-width="1.7" marker-end="url(#punta)"/>
<rect x="80" y="360" width="340" height="70" rx="10" fill="#f3f7fb" stroke="#1f2937" stroke-width="1.6"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="250.0" y="386.9">Clase</tspan><tspan x="250.0" y="403.1">Tubos plásticos para agua</tspan></text>
<path d="M250,430 L250,465" fill="none" stroke="#1f2937" stroke-width="1.7" marker-end="url(#punta)"/>
<rect x="80" y="465" width="340" height="70" rx="10" fill="#f3f7fb" stroke="#1f2937" stroke-width="1.6"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="250.0" y="491.9">Producto (bloque)</tspan><tspan x="250.0" y="508.1">Tubo PPR</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="250" y="595.0">Así lo hacen GS1 GPC y UNSPSC (4 niveles).</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="250" y="615.0">Tu «COFGE» es la misma idea que la biología.</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="780" y="120.0">2. Los atributos de la clase</tspan></text>
<rect x="580" y="150" width="400" height="330" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2.2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="780.0" y="239.1">Tubo PPR</tspan><tspan x="780.0" y="255.9"></tspan><tspan x="780.0" y="272.8">DN (diámetro): 20 mm</tspan><tspan x="780.0" y="289.7">Espesor de pared: 2,8 mm</tspan><tspan x="780.0" y="306.6">SDR / serie: 7,4 / S3.2</tspan><tspan x="780.0" y="323.4">PN: 16 (según DIN 8077)</tspan><tspan x="780.0" y="340.3">Uso: agua fría y caliente</tspan><tspan x="780.0" y="357.2">Largo de tira: 4 m</tspan><tspan x="780.0" y="374.1">Norma, certificación</tspan><tspan x="780.0" y="390.9">Código arancelario</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="780" y="510.0">Cada clase tiene su lista fija de atributos y unidades</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="780" y="530.0">(así lo hace ETIM con productos técnicos).</tspan></text>
<path d="M420,465 L578,320" fill="none" stroke="#1f2937" stroke-width="1.7" marker-end="url(#punta)"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="1280" y="120.0">3. Lo que se sabe del producto</tspan></text>
<rect x="1110" y="150" width="340" height="70" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="1280.0" y="185.0">Reglas y normas</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="1280" y="242.0">SDR → serie → PN · un codo de 20 calza con tubo de 20</tspan></text>
<path d="M982,315 L1108,185" fill="none" stroke="#1f2937" stroke-width="1.7" marker-end="url(#punta)"/>
<rect x="1110" y="275" width="340" height="70" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="1280.0" y="310.0">Equivalencias</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="1280" y="367.0">el 20×2.8 de Lvzhou = el «Tubo PPR 20 PN16» de GESI</tspan></text>
<path d="M982,315 L1108,310" fill="none" stroke="#1f2937" stroke-width="1.7" marker-end="url(#punta)"/>
<rect x="1110" y="400" width="340" height="70" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="1280.0" y="435.0">Documentos</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="1280" y="492.0">fichas técnicas, certificados, normas en PDF</tspan></text>
<path d="M982,315 L1108,435" fill="none" stroke="#1f2937" stroke-width="1.7" marker-end="url(#punta)"/>
<rect x="330" y="680" width="900" height="110" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="780.0" y="718.1">Cómo lo usa el agente</tspan><tspan x="780.0" y="735.0">La jerarquía y los atributos van en la base (el agente los consulta con herramientas) ·</tspan><tspan x="780.0" y="751.9">las reglas van en código o skills · los documentos se buscan cuando hacen falta</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="780.0" y="850.0">En la industria, el sistema que guarda todo esto se llama PIM (gestión de información de producto).</tspan></text>
</svg>