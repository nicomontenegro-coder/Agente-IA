<path d="M685,265 L713,265" fill="none" stroke="#1f2937" stroke-width="1.7" marker-end="url(#punta)"/>
<rect x="715" y="240" width="175" height="50" rx="25" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="802.5" y="265.0">Inspeccionada</tspan></text>
