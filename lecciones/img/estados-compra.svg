<path d="M700,678 L730,738" fill="none" stroke="#1f2937" stroke-width="1.7" marker-end="url(#punta)"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="777.0" y="708.0">pasó el plazo</tspan></text>
<path d="M760,654 L900,654 L900,738" fill="none" stroke="#1f2937" stroke-width="1.7" marker-end="url(#punta)"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="830.0" y="642.0">dijo que no</tspan></text>
