<rect x="655" y="130" width="175" height="50" rx="25" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="742.5" y="155.0">Proveedor elegido</tspan></text>
