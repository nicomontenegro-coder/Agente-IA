<path d="M947,180 L947,212 L147,212 L147,238" fill="none" stroke="#1f2937" stroke-width="1.7" marker-end="url(#punta)"/>
<rect x="380" y="330" width="200" height="46" rx="23" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="480.0" y="353.0">Cancelada</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#b91c1c"><tspan x="600" y="353.0">desde cualquier etapa, con motivo escrito</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#b45309"><tspan x="40" y="410.0">⚙ Cotizando: al enviar la primera invitación   ·   ⚙ Evaluando: al registrar la primera cotización</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#b45309"><tspan x="40" y="434.0">⚙ OC emitida: al registrar la OC   ·   ⚙ Pago asegurado: al registrar la carta de crédito abierta o el anticipo</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#7c3aed"><tspan x="40" y="458.0">Borde punteado: "Certificación local" solo aparece si algún producto la exige</tspan></text>
<path d="M40,500 L1060,500" stroke="#e5e7eb" stroke-width="1.5"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#7c3aed"><tspan x="40" y="530.0">INVITACIÓN (una por cada proveedor invitado)</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="548.8">Cada proveedor tiene su propio estado:</tspan><tspan x="40" y="564.4">así ves de un vistazo quién respondió</tspan><tspan x="40" y="580.0">y quién no. Que una cotización quede</tspan><tspan x="40" y="595.6">eliminada por los filtros se ve al</tspan><tspan x="40" y="611.2">evaluarla, no aquí.</tspan></text>
<rect x="560" y="540" width="160" height="48" rx="24" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="640.0" y="564.0">Enviada</tspan></text>
<rect x="440" y="650" width="160" height="46" rx="23" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="520.0" y="673.0">Respondida ⚙</tspan></text>
<rect x="620" y="650" width="160" height="46" rx="23" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="700.0" y="673.0">Sin respuesta ⚙</tspan></text>
<rect x="800" y="650" width="120" height="46" rx="23" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="860.0" y="673.0">Declinó</tspan></text>
<path d="M600,588 L530,648" fill="none" stroke="#1f2937" stroke-width="1.7" marker-end="url(#punta)"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="525.0" y="618.0">cotizó</tspan></text>
<path d="M660,588 L690,648" fill="none" stroke="#1f2937" stroke-width="1.7" marker-end="url(#punta)"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="737.0" y="618.0">pasó el plazo</tspan></text>
<path d="M720,564 L860,564 L860,648" fill="none" stroke="#1f2937" stroke-width="1.7" marker-end="url(#punta)"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="790.0" y="552.0">dijo que no</tspan></text>
