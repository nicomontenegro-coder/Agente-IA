<rect x="928" y="230" width="190" height="50" rx="25" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="1023.0" y="255.0">Carga inspeccionada</tspan></text>
<path d="M1023,280 L1023,305 L135,305 L135,328" fill="none" stroke="#1f2937" stroke-width="1.7" marker-end="url(#punta)"/>
<rect x="40" y="330" width="190" height="50" rx="25" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="135.0" y="355.0">Embarcada ⚙</tspan></text>
