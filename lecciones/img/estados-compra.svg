<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#b91c1c"><tspan x="640" y="355.0">desde cualquier etapa, con motivo escrito</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#b45309"><tspan x="40" y="420.0">⚙ Cotizando: al enviar la primera invitación</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#b45309"><tspan x="40" y="444.0">⚙ Evaluando: al registrar la primera cotización</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#b45309"><tspan x="40" y="468.0">⚙ OC emitida, Anticipo pagado, Saldo pagado: al registrar la OC y cada pago</tspan></text>
<path d="M40,500 L1060,500" stroke="#e5e7eb" stroke-width="1.5"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#7c3aed"><tspan x="40" y="530.0">INVITACIÓN (una por cada proveedor invitado)</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="551.6">Cada proveedor tiene su propio estado:</tspan><tspan x="40" y="567.2">así ves de un vistazo quién respondió</tspan><tspan x="40" y="582.8">y quién no. La Compra pasa sola a</tspan><tspan x="40" y="598.4">"Evaluando" con la primera Respondida.</tspan></text>
<rect x="560" y="540" width="160" height="48" rx="24" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="640.0" y="564.0">Enviada</tspan></text>
<rect x="440" y="650" width="160" height="46" rx="23" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="520.0" y="673.0">Respondida ⚙</tspan></text>
<rect x="620" y="650" width="160" height="46" rx="23" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="700.0" y="673.0">Sin respuesta ⚙</tspan></text>
<rect x="800" y="650" width="120" height="46" rx="23" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="860.0" y="673.0">Declinó</tspan></text>
