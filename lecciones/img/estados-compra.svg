<path d="M674,355 L704,355" fill="none" stroke="#1f2937" stroke-width="1.7" marker-end="url(#punta)"/>
<rect x="706" y="330" width="190" height="50" rx="25" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="801.0" y="355.0">Recibida</tspan></text>
<path d="M896,355 L926,355" fill="none" stroke="#1f2937" stroke-width="1.7" marker-end="url(#punta)"/>
<rect x="928" y="330" width="190" height="50" rx="25" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="1023.0" y="355.0">Cerrada ⚙</tspan></text>
<rect x="420" y="430" width="200" height="46" rx="23" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="520.0" y="453.0">Cancelada</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#b91c1c"><tspan x="640" y="453.0">desde cualquier etapa, con motivo escrito</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#b45309"><tspan x="40" y="510.0">⚙ Cotizando: al enviar la primera invitación · Evaluando: al registrar la primera cotización · OC emitida: al registrar la OC</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#b45309"><tspan x="40" y="534.0">⚙ Primer pago: carta de crédito abierta o anticipo pagado · Embarcada: al registrar el BL · Segundo pago: saldo o pago del banco</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#b45309"><tspan x="40" y="558.0">⚙ Cerrada: cuando calzan la OC, lo recibido y la factura · Borde punteado: "Muestras" solo si se pidieron</tspan></text>
<path d="M40,590 L1140,590" stroke="#e5e7eb" stroke-width="1.5"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#7c3aed"><tspan x="40" y="620.0">INVITACIÓN (una por cada proveedor invitado)</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="654.4">Cada proveedor tiene su propio estado:</tspan><tspan x="40" y="670.0">así ves de un vistazo quién respondió</tspan><tspan x="40" y="685.6">y quién no.</tspan></text>
<rect x="600" y="630" width="160" height="48" rx="24" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="680.0" y="654.0">Enviada</tspan></text>
<rect x="480" y="740" width="160" height="46" rx="23" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="560.0" y="763.0">Respondida ⚙</tspan></text>
<rect x="660" y="740" width="160" height="46" rx="23" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="740.0" y="763.0">Sin respuesta ⚙</tspan></text>
<rect x="840" y="740" width="120" height="46" rx="23" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="900.0" y="763.0">Declinó</tspan></text>
