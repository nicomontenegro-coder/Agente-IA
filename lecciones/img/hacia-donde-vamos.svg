<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#6d28d9"><tspan x="545" y="555.0">Una sola base de datos: la fuente de verdad de GESI</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="1060" y="95.0">QUIÉN TRABAJA EN QUÉ</tspan></text>
