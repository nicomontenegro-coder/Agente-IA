<text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="650.0" y="56.0">Una sola app con los datos, un agente encima y dos sesiones de trabajo con tareas separadas</tspan></text>
