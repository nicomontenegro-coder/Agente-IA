<rect x="1060" y="400" width="210" height="170" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="1165.0" y="455.0">Sesión de Importa</tspan><tspan x="1165.0" y="470.0">(la otra)</tspan><tspan x="1165.0" y="485.0">módulos de la app:</tspan><tspan x="1165.0" y="500.0">RFQ, factura, cobro</tspan><tspan x="1165.0" y="515.0">y su base de datos</tspan></text>
