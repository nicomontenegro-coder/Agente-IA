<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="545" y="272.0">Lee, propone y registra. Te pide aprobación antes de enviar o comprometer dinero.</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="545" y="302.0">Usa herramientas que llaman a las mismas funciones de Importa: no tiene datos propios.</tspan></text>
