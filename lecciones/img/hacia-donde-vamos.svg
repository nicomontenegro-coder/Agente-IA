<text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="665" y="625.0">Las dos sesiones se coordinan por GitHub, no por memoria:</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="665" y="652.0">cada una sube sus cambios a su repositorio, y la otra trae lo último antes de empezar.</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="665" y="676.0">Lo que hay que recordar queda escrito en REGLAS.md y CLAUDE.md, no en la conversación.</tspan></text>
