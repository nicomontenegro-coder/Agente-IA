<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="565.0">• Traer o registrar cliente: Clientes (canal de venta como tabla, RUT único). Ya existe. Lo de Importa se trae y se adapta, no se copia.</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="589.0">• Contactar o visitar: cada gestión queda en el historial del cliente; el cambio de etapa del embudo también, con su motivo. Ya existe.</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="613.0">• Preparar cotización: el precio sale de la lista de venta (Precios) según el canal del cliente. El agente la arma; Nico la aprueba. Lo que sigue.</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="637.0">• Negociar: el descuento no puede cruzar el margen mínimo de la lista de venta (descuento máximo por producto). Lo que sigue.</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="661.0">• Etapas del embudo que se marcan solas: Cotizado al enviar la cotización, Ganado al aceptarla.</tspan></text>
