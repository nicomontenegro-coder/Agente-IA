<text font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="850.0" y="30.0">Borrador para aprobar (v2): clases de la familia PPR, con variantes</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="850.0" y="56.0">Una clase = productos que se describen con los mismos atributos · * lo calcula la app, no se escribe</tspan></text>
