<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="1600" height="1000" fill="#ffffff"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="800.0" y="30.0">Borrador para aprobar (v3): familia PPR con dos clases</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="800.0" y="56.0">El tipo de fitting es un atributo, no una clase · * lo calcula la app, no se escribe</tspan></text>
<rect x="600" y="95" width="400" height="50" rx="10" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.6"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="800.0" y="120.0">Segmento: Materiales de construcción</tspan></text>
<path d="M800,145 L800,170" fill="none" stroke="#1f2937" stroke-width="1.7" marker-end="url(#punta)"/>
<rect x="600" y="172" width="400" height="50" rx="10" fill="#f3f7fb" stroke="#1f2937" stroke-width="1.6"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="800.0" y="197.0">Familia: Sistemas de cañerías PPR</tspan></text>
