<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="1040" y="850.0">Cada variante es un SKU: se cotiza, se compra y tiene precio. Se enlaza con el ítem de cada proveedor (equivalencias).</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="850.0" y="930.0">Para buscar no se agregan niveles: se filtra por atributo (diámetro, PN, tipo) — clasificación por facetas.</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="850.0" y="956.0">Una clase se parte cuando sus miembros necesitan atributos distintos, no cuando tiene muchos miembros.</tspan></text>
