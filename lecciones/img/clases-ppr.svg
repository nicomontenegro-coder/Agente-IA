<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="485.0">Atributos comunes a todas las clases: material PPR · uso (agua fría/caliente) · norma de fabricación · código arancelario · «calza con» *</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="540.0">Debajo de cada clase: el producto (modelo) y sus variantes (lo que tiene precio)</tspan></text>
