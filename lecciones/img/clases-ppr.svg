<rect x="150" y="272" width="500" height="280" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2.2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="400.0" y="359.5">Clase: Tubo PPR</tspan><tspan x="400.0" y="377.0"></tspan><tspan x="400.0" y="394.5">Diámetro (DN), mm</tspan><tspan x="400.0" y="412.0">Espesor de pared, mm</tspan><tspan x="400.0" y="429.5">SDR * · serie * · PN *</tspan><tspan x="400.0" y="447.0">Largo de tira, m</tspan><tspan x="400.0" y="464.5">Desnudo / preaislado</tspan></text>
<rect x="950" y="272" width="500" height="280" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2.2"/><text font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="1200.0" y="350.8">Clase: Fitting PPR</tspan><tspan x="1200.0" y="368.2"></tspan><tspan x="1200.0" y="385.8">Tipo: codo 90° · codo 45° · tee · copla ·</tspan><tspan x="1200.0" y="403.2">reducción · terminal · tapón</tspan><tspan x="1200.0" y="420.8">Diámetro (DN), mm</tspan><tspan x="1200.0" y="438.2">Diámetro 2, mm — solo reducción y tee reducida</tspan><tspan x="1200.0" y="455.8">Rosca H / M y medida — solo terminal</tspan><tspan x="1200.0" y="473.2">Inserto bronce / acero — solo terminal</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="1200" y="580.0">Regla: los atributos «solo …» se exigen según el tipo (una reducción necesita diámetro 2).</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="800" y="625.0">Comunes a las dos clases: material PPR · uso (agua fría/caliente) · norma de fabricación · código arancelario · «calza con» *</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="690.0">Debajo de cada clase: el modelo y sus variantes (lo que tiene precio)</tspan></text>
