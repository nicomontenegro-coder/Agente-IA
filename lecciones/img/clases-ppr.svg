<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="1030" y="955.0">Cada variante es un SKU con precio, enlazado con el ítem de cada proveedor (equivalencias). Para buscar: filtros por atributo.</tspan></text>
