<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="565.0">• Leer la lista completa [+]: todos los productos, con su unidad (metro, pieza), validez y moneda. La IA lee; la app verifica.</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="589.0">• Calcular landed estimado [+]: precio FOB × factor de sobrecosto del costeo de referencia. Un factor por familia: el flete se cobra por volumen,</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="613.0">   y un tubo (mucho aire por dólar) carga más flete que un codo. Un solo factor para todo encarece los codos y abarata los tubos.</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f2937"><tspan x="40" y="637.0">• La lista de venta vence con la del proveedor (10 días en Lvzhou) o si el dólar se mueve: entonces se recalcula, no se reescribe a mano.</tspan></text>
