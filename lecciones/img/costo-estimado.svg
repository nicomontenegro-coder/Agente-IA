<text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1f2937"><tspan x="750.0" y="700.0">Si cada proceso calculara su propio landed, el mismo tubo tendría tres costos distintos según la pantalla (regla 1 de Importa).</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4b5563"><tspan x="750.0" y="726.0">Una estimación vencida no se borra: queda con su fecha, para saber con qué número se decidió (lo decidido se congela).</tspan></text>
